<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ذكرياتنا ❤️</title><meta name="theme-color" content="#d6336c"><script src="config.js"></script><style>

:root{--p:#d6336c;--pd:#a61e4d;--s:#ffe3ec;--bg:#fff8fa;--alt:#fff0f5;--t:#4a1942;--mut:#9d6b83;--gold:#f2b880}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,'Segoe UI',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--t);overflow-x:hidden}button,input{font:inherit}.hidden{display:none!important}.screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(180deg,var(--s),var(--bg),var(--s));position:relative;overflow:hidden}.card{width:100%;max-width:410px;background:#ffffffd9;border:1px solid #fff;backdrop-filter:blur(10px);border-radius:28px;padding:32px;box-shadow:0 20px 60px #d6336c40;text-align:center;position:relative;z-index:2}.lock{width:64px;height:64px;margin:auto auto 20px;border-radius:50%;display:grid;place-items:center;background:var(--p);color:white;font-size:27px;box-shadow:0 10px 25px #d6336c55}.title{color:var(--p);margin:0;font-size:30px;line-height:1.35}.muted{color:var(--mut);font-size:14px}.field{position:relative;margin-top:22px}.field input{width:100%;border:2px solid var(--s);border-radius:18px;padding:13px 45px 13px 42px;text-align:center;outline:none;background:white;color:var(--t)}.field input:focus{border-color:var(--p)}.eye{position:absolute;left:12px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--mut);cursor:pointer}.primary{width:100%;border:0;border-radius:18px;background:var(--p);color:#fff;padding:13px 16px;font-weight:700;cursor:pointer;box-shadow:0 10px 25px #d6336c40;transition:.2s}.primary:hover{background:var(--pd)}.primary:active{transform:scale(.98)}.wrong{animation:shake .5s}.hearts{position:absolute;inset:0;pointer-events:none}.heart{position:absolute;color:#d6336c55;animation:float 4s ease-in-out infinite}.spark{position:absolute;color:#f2b88099;animation:spark 2.5s ease-in-out infinite}@keyframes float{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-18px) rotate(5deg)}}@keyframes spark{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}@keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}main{animation:rise .6s ease}.hero{position:relative;text-align:center;padding:64px 20px 55px;background:linear-gradient(180deg,var(--s),var(--bg));overflow:hidden}.wrap{width:100%;max-width:430px;margin:auto;position:relative;z-index:1}.hero h1{font-size:40px;line-height:1.3;color:var(--p);margin:0}.hero p{font-size:16px;line-height:1.8;margin:14px auto;color:#4a1942cc;max-width:360px}.cover{margin:28px auto 0;aspect-ratio:4/5;max-width:390px;overflow:hidden;border:4px solid white;border-radius:28px;box-shadow:0 25px 50px #d6336c66}.cover img{width:100%;height:100%;object-fit:cover;display:block}.section{padding:52px 20px}.section.alt{background:var(--alt)}.section h2{text-align:center;color:var(--p);font-size:26px;margin:0}.sub{text-align:center;color:var(--mut);font-size:14px;margin:4px 0 25px}.message{background:white;border:2px solid var(--s);border-radius:24px;padding:24px;box-shadow:0 15px 40px #d6336c20;text-align:center;line-height:2;white-space:pre-line}.music{background:linear-gradient(135deg,#fff,#fff0f5);border:2px solid white;border-radius:24px;padding:18px;box-shadow:0 15px 40px #d6336c20}.musicrow{display:flex;align-items:center;gap:14px}.musiccover{width:60px;height:60px;border-radius:16px;object-fit:cover}.play{width:48px;height:48px;border:0;border-radius:50%;background:var(--p);color:white;cursor:pointer}.musicname{font-weight:700;color:var(--p)}.range{width:100%;accent-color:var(--p)}.time{display:flex;justify-content:space-between;font-size:11px;color:var(--mut)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.thumb{position:relative;aspect-ratio:1;border:2px solid white;border-radius:18px;overflow:hidden;padding:0;background:var(--s);cursor:pointer;box-shadow:0 8px 25px #d6336c18}.thumb img{width:100%;height:100%;object-fit:cover;transition:.5s}.thumb:hover img{transform:scale(1.08)}.caption{position:absolute;bottom:0;left:0;right:0;color:#fff;text-align:right;padding:18px 8px 7px;font-size:12px;background:linear-gradient(transparent,#0009)}.video{background:white;border:2px solid white;border-radius:24px;overflow:hidden;box-shadow:0 15px 40px #d6336c20;margin-bottom:18px}.video video{width:100%;display:block;aspect-ratio:16/9;object-fit:cover;background:var(--s)}.video p{text-align:center;color:var(--p);font-weight:700;padding:10px;margin:0}.final{text-align:center;padding:65px 20px;background:linear-gradient(var(--bg),var(--s));position:relative}.final .bigheart{font-size:42px;color:var(--p);animation:float 3s infinite}.final h2{color:var(--p);font-size:28px}.footer{text-align:center;color:var(--mut);font-size:13px;padding:28px}.lightbox{position:fixed;inset:0;background:#000e;z-index:99;display:flex;align-items:center;justify-content:center;padding:60px 20px}.lightbox img{max-width:100%;max-height:80vh;border-radius:18px;object-fit:contain}.lbbtn{position:absolute;border:0;background:#ffffff1a;color:#fff;border-radius:50%;width:44px;height:44px;cursor:pointer;font-size:24px}.close{top:18px;right:18px}.prev{right:18px;top:50%;transform:translateY(-50%)}.next{left:18px;top:50%;transform:translateY(-50%)}.counter{position:absolute;top:24px;left:24px;color:#fff;background:#ffffff1a;padding:4px 10px;border-radius:20px;font-size:12px}.lbcap{position:absolute;bottom:18px;color:#fff;text-align:center;max-width:80%}@media(max-width:699px){
  html{font-size:16px}
  .screen{min-height:100svh;padding:14px}
  .card{max-width:100%;padding:24px 18px;border-radius:22px}
  .lock{width:58px;height:58px;margin-bottom:14px;font-size:24px}
  .title{font-size:25px}
  .field{margin-top:18px}.field input{padding:14px 42px 14px 40px;font-size:16px}
  .primary{padding:14px 16px;min-height:50px}
  .hero{padding:38px 14px 34px}
  .wrap{width:100%;max-width:100%;padding:0}
  .hero h1{font-size:30px}
  .hero p{font-size:14px;line-height:1.8;margin:10px auto 0}
  .cover{width:min(100%,340px);margin:20px auto 0;border-width:3px;border-radius:22px}
  .section{padding:32px 14px}
  .section h2{font-size:23px}
  .sub{font-size:13px;margin:3px 0 18px}
  .message{padding:18px 16px;border-radius:20px;line-height:1.9;font-size:14px}
  .message h2{font-size:21px!important}
  .music{padding:14px;border-radius:20px}
  .musicrow{gap:10px}.musiccover{width:52px;height:52px;border-radius:14px}.play{width:46px;height:46px;flex:0 0 46px}
  .musicname{font-size:14px}.muted{font-size:12px}
  .range{height:28px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
  .thumb{min-width:0;border-radius:15px}
  .caption{font-size:11px;padding:18px 7px 6px}
  .video{border-radius:20px;margin-bottom:14px}
  .video video{width:100%;height:auto;min-height:0;aspect-ratio:16/9;object-fit:contain}
  .video p{font-size:13px;padding:9px 6px}
  .final{padding:44px 14px}.final .bigheart{font-size:36px}.final h2{font-size:24px}.final p{font-size:14px;line-height:1.8}
  .footer{font-size:12px;padding:22px 14px}
  .lightbox{padding:58px 10px 70px}
  .lightbox img{max-width:100%;max-height:72svh;border-radius:14px}
  .lbbtn{width:46px;height:46px;font-size:22px}
  .close{top:10px;right:10px}.prev{right:8px}.next{left:8px}
  .counter{top:16px;left:16px;font-size:11px}
  .lbcap{bottom:14px;max-width:86%;font-size:12px}
}
@media(max-width:380px){
  .hero{padding-top:30px}.hero h1{font-size:26px}.hero p{font-size:13px}
  .grid{grid-template-columns:1fr}
  .cover{max-width:300px}
  .card{padding:20px 15px}
}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}.wrap{max-width:560px}.section{padding-left:24px;padding-right:24px}}
</style></head><body><div id="app"></div><script>
const c=window.siteConfig;const root=document.documentElement;root.dir=c.site.direction||'rtl';document.title=c.site.tabTitle||c.site.title;for(const [k,v] of Object.entries(c.theme))root.style.setProperty('--'+({primaryColor:'p',primaryDark:'pd',secondaryColor:'s',backgroundColor:'bg',backgroundAlt:'alt',textColor:'t',textMuted:'mut',goldAccent:'gold'}[k]||k),v);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function hearts(){return '<div class="hearts"><span class="heart" style="top:9%;left:8%;font-size:22px">♥</span><span class="spark" style="top:20%;left:88%;font-size:18px">✦</span><span class="heart" style="top:75%;left:90%;font-size:20px">♥</span><span class="spark" style="top:55%;left:6%;font-size:16px">✦</span></div>'}
function password(){app.innerHTML=`<div class="screen">${hearts()}<form id="login" class="card"><div class="lock">🔒</div><h1 class="title">${esc(c.passwordScreen.title)}</h1><p class="muted">${esc(c.passwordScreen.subtitle)}</p><div class="field"><input id="pass" type="password" placeholder="${esc(c.passwordScreen.placeholder)}" autofocus><button class="eye" type="button" id="eye">👁</button></div><p id="err" class="muted hidden" style="color:#e11">${esc(c.passwordScreen.wrongPasswordText)}</p><button class="primary" style="margin-top:16px">❤️ ${esc(c.passwordScreen.buttonText)}</button></form></div>`;login.onsubmit=e=>{e.preventDefault();if(pass.value===c.password){render()}else{login.classList.add('wrong');err.classList.remove('hidden');setTimeout(()=>login.classList.remove('wrong'),550)}};eye.onclick=()=>{pass.type=pass.type==='password'?'text':'password'} }
function render(){let g=(c.gallery||[]).map((x,i)=>`<button class="thumb" data-i="${i}"><img src="${esc(x.src)}" alt="${esc(x.caption||'')}"><span class="caption">${esc(x.caption||'')}</span></button>`).join('');let vids=(c.videos||[]).map(v=>`<div class="video"><video src="${esc(v.src)}" poster="${esc(v.poster||'')}" controls playsinline webkit-playsinline preload="metadata"></video><p>${esc(v.title)}</p></div>`).join('');app.innerHTML=`<main><section class="hero">${hearts()}<div class="wrap"><h1>${esc(c.hero.title)}</h1><p>${esc(c.hero.description)}</p><div class="cover"><img src="${esc(c.hero.image)}" alt="صورة الغلاف"></div></div></section><section class="section"><div class="wrap"><div class="message"><h2 style="color:var(--p);margin-top:0">${esc(c.message.title)}</h2><div>${esc(c.message.text)}</div></div></div></section>${c.music.enabled?`<section class="section alt"><div class="wrap"><h2>🎵 ${esc(c.music.title)}</h2><p class="sub">${esc(c.music.artist)}</p><div class="music"><div class="musicrow"><img class="musiccover" src="${esc(c.music.cover)}"><button class="play" id="play">▶</button><div><div class="musicname">${esc(c.music.title)}</div><div class="muted">${esc(c.music.artist)}</div></div></div><audio id="audio" src="${esc(c.music.src)}"></audio><input class="range" id="seek" type="range" min="0" max="100" value="0"><div class="time"><span id="cur">0:00</span><span id="dur">0:00</span></div></div></div></section>`:''}<section class="section"><div class="wrap"><h2>${esc(c.gallerySection.title)}</h2><p class="sub">${esc(c.gallerySection.subtitle)}</p><div class="grid" id="gallery">${g}</div></div></section><section class="section alt"><div class="wrap"><h2>${esc(c.videoSection.title)}</h2><p class="sub">${esc(c.videoSection.subtitle)}</p>${vids}</div></section><section class="final">${hearts()}<div class="wrap"><div class="bigheart">♥</div><h2>${esc(c.finalMessage.title)}</h2><p>${esc(c.finalMessage.text)}</p></div></section><footer class="footer">${esc(c.footer.text)} ♥ ${esc(c.footer.year)}</footer></main>`;initMusic();initGallery()}
function fmt(x){if(!isFinite(x))return'0:00';return Math.floor(x/60)+':'+String(Math.floor(x%60)).padStart(2,'0')}
function initMusic(){if(!c.music.enabled)return;const a=document.getElementById('audio'),p=document.getElementById('play'),s=document.getElementById('seek');p.onclick=()=>a.paused?(a.play(),p.textContent='❚❚'):(a.pause(),p.textContent='▶');a.ontimeupdate=()=>{s.value=a.duration?(a.currentTime/a.duration*100):0;cur.textContent=fmt(a.currentTime)};a.onloadedmetadata=()=>dur.textContent=fmt(a.duration);a.onended=()=>p.textContent='▶';s.oninput=()=>{if(a.duration)a.currentTime=s.value/100*a.duration};if(c.music.autoplay)a.play().catch(()=>{})}
function initGallery(){const items=c.gallery||[];let i=0;gallery?.querySelectorAll('.thumb').forEach(b=>b.onclick=()=>{i=+b.dataset.i;openLB()});function openLB(){document.body.insertAdjacentHTML('beforeend',`<div class="lightbox" id="lb"><button class="lbbtn close">×</button><button class="lbbtn prev">›</button><button class="lbbtn next">‹</button><span class="counter">${i+1} / ${items.length}</span><img src="${esc(items[i].src)}"><div class="lbcap">${esc(items[i].caption||'')}</div></div>`);lb.onclick=e=>{if(e.target===lb||e.target.classList.contains('close'))lb.remove()};lb.querySelector('.prev').onclick=e=>{e.stopPropagation();i=(i-1+items.length)%items.length;lb.remove();openLB()};lb.querySelector('.next').onclick=e=>{e.stopPropagation();i=(i+1)%items.length;lb.remove();openLB()};document.onkeydown=e=>{if(e.key==='Escape')lb.remove();if(e.key==='ArrowLeft')lb.querySelector('.next').click();if(e.key==='ArrowRight')lb.querySelector('.prev').click()}}}
password();
</script></body></html>
